<div class="content-card">

    <div class="content-card-header">
        Circulars & Memos
    </div>

    <div class="circulars-body">
@if (loading) {

    <div class="text-center py-4">

    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>

    <div class="mt-2">
        Loading circulars...
    </div>

</div>

}
@else {
    
        <table class="table table-hover border-0">

            <tbody>

                @for(item of circulars; track item.id) {

                    <tr>

                        <td class="news-column">
                            {{ item.description }}
                        </td>

                        <td class="title-column">
                            {{ item.title }}
                        </td>

                        <td class="pdf-column">

                            <a
    [href]="item.filePath"
    target="_blank"
    rel="noopener noreferrer">

                                <img
                                    src="/images/icon-pdf.png"
                                    alt="Open PDF"
                                    width="30">

                            </a>

                        </td>

                    </tr>

                }

            </tbody>

        </table>
    }
    </div>

</div>
