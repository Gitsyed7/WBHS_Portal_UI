<div class="wbhs-page-wrapper py-3">
  <div class="container-fluid px-2 px-md-4">
    
    <!-- Mandatory Notice Banner -->
    <div class="alert alert-wbhs-notice shadow-sm mb-4" role="alert">
      <div class="d-flex align-items-start">
        <i class="bi bi-exclamation-triangle-fill text-danger me-2 fs-5 mt-1"></i>
        <div>
          <strong class="text-danger">Important Notice:</strong> Inputs marked with <span class="text-danger fw-bold">*</span> are mandatory data. You must enter those details for your online registration to be successful and for availing reimbursement benefits.
        </div>
      </div>
    </div>

    <!-- Personal Information Card -->
    <div class="card wbhs-card shadow-sm mb-4">
      <div class="card-header wbhs-card-header d-flex align-items-center py-3">
        <i class="bi bi-person-lines-fill header-icon me-2"></i>
        <h5 class="card-title mb-0 fw-bold">Personal Details</h5>
      </div>
      
      <div class="card-body p-3 p-md-4">
        <!-- Retirement Age -->
        <div class="row mb-4">
          <div class="col-12">
            <label class="form-label fw-bold text-wbhs-primary">
              Select Retirement Age <span class="text-danger">*</span>
            </label>
            <div class="d-flex flex-wrap gap-4 mt-1 p-3 rounded retirement-box">
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="rad_ret_yr" id="ret_yr_60" value="60">
                <label class="form-check-label fw-bold text-wbhs-navy" for="ret_yr_60">60 Years</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="rad_ret_yr" id="ret_yr_62" value="62">
                <label class="form-check-label fw-bold text-wbhs-navy" for="ret_yr_62">62 Years</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="rad_ret_yr" id="ret_yr_65" value="65">
                <label class="form-check-label fw-bold text-wbhs-navy" for="ret_yr_65">65 Years</label>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-3">
          <!-- First Name -->
          <div class="col-12 col-md-6">
            <label for="txt_fname" class="form-label fw-bold text-wbhs-primary">
              First Name <span class="text-danger">*</span>
            </label>
            <input type="text" id="txt_fname" name="txt_fname" class="form-control text-uppercase" placeholder="Enter First Name" autocomplete="off">
            <div class="form-text text-muted small">(First Name + Middle Name)</div>
          </div>

          <!-- Last Name -->
          <div class="col-12 col-md-6">
            <label for="txt_lname" class="form-label fw-bold text-wbhs-primary">
              Last Name <span class="text-danger">*</span>
            </label>
            <input type="text" id="txt_lname" name="txt_lname" class="form-control text-uppercase" placeholder="Enter Last Name" autocomplete="off">
            <div class="form-text text-muted small">(Surname)</div>
          </div>

          <!-- Gender -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="sex_ddlist" class="form-label fw-bold text-wbhs-primary">
              Gender <span class="text-danger">*</span>
            </label>
            <select id="sex_ddlist" name="sex_ddlist" class="form-select">
              <option value="" selected disabled>-- Select Gender --</option>
            </select>
          </div>

          <!-- Marital Status -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="mrt_ddlist" class="form-label fw-bold text-wbhs-primary">
              Marital Status <span class="text-danger">*</span>
            </label>
            <select id="mrt_ddlist" name="mrt_ddlist" class="form-select">
              <option value="" selected disabled>-- Select Marital Status --</option>
            </select>
          </div>

          <!-- Residing District -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="dist_ddlist" class="form-label fw-bold text-wbhs-primary">
              Residing District <span class="text-danger">*</span>
            </label>
            <select id="dist_ddlist" name="dist_ddlist" class="form-select">
              <option value="" selected disabled>-- Select Residing District --</option>
            </select>
          </div>

          <!-- Permanent Address -->
          <div class="col-12">
            <label for="txt_addr" class="form-label fw-bold text-wbhs-primary">
              Permanent Address <span class="text-danger">*</span>
            </label>
            <textarea id="txt_addr" name="txt_addr" class="form-control text-uppercase" rows="3" placeholder="Enter Permanent Address" autocomplete="off"></textarea>
          </div>

          <!-- Mobile No -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="txt_mob" class="form-label fw-bold text-wbhs-primary">
              Mobile No. <span class="text-danger">*</span>
            </label>
            <input type="tel" id="txt_mob" name="txt_mob" class="form-control" maxlength="10" placeholder="10-digit Mobile Number" autocomplete="off">
          </div>

          <!-- Email Address -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="txt_email" class="form-label fw-bold text-wbhs-primary">
              Email Address <span class="text-danger">*</span>
            </label>
            <input type="email" id="txt_email" name="txt_email" class="form-control text-lowercase" placeholder="name@example.com" autocomplete="off">
          </div>

          <!-- Residence Phone Number -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="txt_ph_no" class="form-label fw-bold text-wbhs-primary">
              Residence Phone Number
            </label>
            <input type="tel" id="txt_ph_no" name="txt_ph_no" class="form-control" placeholder="Enter Phone Number" autocomplete="off">
          </div>

          <!-- Identity Proof Selection -->
          <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label fw-bold text-wbhs-primary">
              Select Identity Proof <span class="text-danger">*</span>
            </label>
            <div class="d-flex gap-3 mt-1 p-2 rounded identity-box">
              <div class="form-check me-3">
                <input class="form-check-input" type="radio" name="rdlist_id_prf" id="id_prf_voter" value="01">
                <label class="form-check-label fw-semibold" for="id_prf_voter">Voter Card</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="rdlist_id_prf" id="id_prf_pan" value="02">
                <label class="form-check-label fw-semibold" for="id_prf_pan">PAN Card</label>
              </div>
            </div>
          </div>

          <!-- Identity Proof No -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="txt_id_prf" class="form-label fw-bold text-wbhs-primary" id="lbl_pan_voter">
              Identity Proof No.
            </label>
            <input type="text" id="txt_id_prf" name="txt_id_prf" class="form-control text-uppercase" placeholder="Enter Identity Proof No." autocomplete="off">
          </div>

          <!-- Aadhaar No -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="txt_aadhaar_no" class="form-label fw-bold text-wbhs-primary">
              Aadhaar No. <span class="text-danger">*</span>
            </label>
            <input type="text" id="txt_aadhaar_no" name="txt_aadhaar_no" class="form-control" maxlength="12" placeholder="12-digit Aadhaar Number" autocomplete="off">
          </div>
        </div>
      </div>
    </div>

    <!-- Bank Details Card -->
    <div class="card wbhs-card shadow-sm mb-4">
      <div class="card-header wbhs-card-header d-flex align-items-center py-3">
        <i class="bi bi-bank2 header-icon me-2"></i>
        <h5 class="card-title mb-0 fw-bold text-danger text-decoration-underline">Bank Details</h5>
      </div>
      
      <div class="card-body p-3 p-md-4">
        <div class="row g-3">
          <!-- IFSC Code -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="txt_ifsc_cd" class="form-label fw-bold text-wbhs-primary">
              Bank IFS Code (IFSC) <span class="text-danger">*</span>
            </label>
            <input type="text" id="txt_ifsc_cd" name="txt_ifsc_cd" class="form-control text-uppercase" maxlength="11" placeholder="Please enter bank IFSC" autocomplete="off">
            <div id="bank_ifsc" class="autocomplete-container"></div>
          </div>

          <!-- Bank Name -->
          <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label fw-bold text-wbhs-primary">Bank Name</label>
            <div class="display-field rounded px-3 py-2 fw-semibold" id="Lbl_bank_name">--</div>
          </div>

          <!-- Branch Name -->
          <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label fw-bold text-wbhs-primary">Branch Name</label>
            <div class="display-field rounded px-3 py-2 fw-semibold" id="Lbl_branch_name">--</div>
          </div>

          <!-- MICR Code -->
          <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label fw-bold text-wbhs-primary">MICR Code</label>
            <div class="display-field rounded px-3 py-2 fw-semibold" id="Lbl_MICR">--</div>
          </div>

          <!-- Account No -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="txt_ac_no" class="form-label fw-bold text-wbhs-primary">
              Account No. <span class="text-danger">*</span>
            </label>
            <input type="text" id="txt_ac_no" name="txt_ac_no" class="form-control" maxlength="17" placeholder="Enter your account no." autocomplete="off">
          </div>

          <!-- Confirm Account No -->
          <div class="col-12 col-md-6 col-lg-4">
            <label for="txt_cnfm_ac_no" class="form-label fw-bold text-wbhs-primary">
              Confirm Account No. <span class="text-danger">*</span>
            </label>
            <input type="text" id="txt_cnfm_ac_no" name="txt_cnfm_ac_no" class="form-control" maxlength="17" placeholder="Confirm your account no." autocomplete="off">
          </div>

          <div class="col-12 mt-2">
            <div class="alert alert-danger py-2 px-3 mb-0 d-inline-flex align-items-center fs-7">
              <i class="bi bi-info-circle me-2"></i>
              <span>Account No. should be 9-17 digits.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Submit / Action Section -->
    <div class="row my-4">
      <div class="col-12 d-flex justify-content-center gap-3">
        <button type="button" id="btn_next_per" class="btn btn-wbhs-submit px-4 py-2 shadow-sm fw-bold">
          Save &amp; Continue
        </button>
        <button type="button" id="final_nxt_per" class="btn btn-secondary px-4 py-2 shadow-sm fw-bold d-none">
          Next
        </button>
      </div>
    </div>

  </div>
</div>
